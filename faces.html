<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Your home tour</title>
<link rel="icon" href="icons/favicon-32.png">
<style>
  /* Buyer taps their own faces (2026-10-29): faces.html?t=<token>. The buyer
     picks a face for each home on their tour, on their own phone, with an
     optional note. Read and saved through the Supabase `reminders` function
     (op=tour / op=face). No codes, no agent notes, nothing about the sellers. */
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #eef0ef; color: #1f2326; font: 17px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; }
  header { background: #1f2326; color: #fff; padding: 18px 16px 16px; border-bottom: 4px solid #19c3b1; }
  header .in, main { max-width: 560px; margin: 0 auto; }
  .kicker { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #2fd8c5; }
  h1 { margin: 4px 0 2px; font-size: 28px; line-height: 1.05; text-transform: uppercase; }
  header p { margin: 0; color: #c5ccc9; font-size: 15px; }
  main { padding: 14px 16px 40px; display: flex; flex-direction: column; gap: 12px; }
  .home { background: #fff; border: 1px solid #d5dad8; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .home h2 { margin: 0; font-size: 20px; }
  .home .s { color: #5f676a; font-size: 14px; }
  .faces { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .face { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 76px; padding: 6px 2px; border: 2px solid #d5dad8; border-radius: 12px; background: #fff; color: #1f2326; font: 700 12px/1.15 system-ui, sans-serif; text-align: center; cursor: pointer; }
  .face[aria-pressed="true"] { border-color: #19c3b1; background: #e6f8f6; }
  textarea { width: 100%; min-height: 60px; border: 1px solid #c5ccc9; border-radius: 10px; padding: 8px 10px; font: inherit; resize: vertical; }
  .saved { font-size: 13px; color: #1f6e33; min-height: 18px; }
  .saved.err { color: #b3261e; }
  .end { color: #5f676a; font-size: 14px; text-align: center; }
  .end a { color: #0b7a6e; font-weight: 700; }
  .gone { padding: 60px 10px; text-align: center; }
</style>
</head>
<body>
<header><div class="in" id="h"><div class="kicker">Loading…</div></div></header>
<main id="m"></main>
<script type="module">
  import { SUPABASE_URL, SUPABASE_ANON_KEY } from './js/config.js';
  import { REACTIONS, reactionFace } from './js/faces.js';
  const FN = `${SUPABASE_URL}/functions/v1/reminders`;
  const t = new URLSearchParams(location.search).get('t') || '';
  const h = document.getElementById('h'), m = document.getElementById('m');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clock = (x) => { const hh = Math.floor(x / 60), mm = String(x % 60).padStart(2, '0'); return `${((hh + 11) % 12) + 1}:${mm} ${hh < 12 ? 'AM' : 'PM'}`; };
  async function save(card, body) {
    const out = card.querySelector('.saved');
    out.className = 'saved'; out.textContent = 'Saving…';
    try {
      const r = await fetch(FN, { method: 'POST', headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ op: 'face', t, ...body }) });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || 'Could not save');
      out.textContent = '✓ Saved. Your agent can see it.';
    } catch (e) { out.className = 'saved err'; out.textContent = e.message + ' Try again.'; }
  }
  try {
    const r = await fetch(`${FN}?op=tour&t=${encodeURIComponent(t)}`, { headers: { apikey: SUPABASE_ANON_KEY } });
    const p = await r.json();
    if (!r.ok) throw new Error(p.error || 'This link has ended.');
    const agent = p.agent && p.agent.full_name ? p.agent.full_name : 'your agent';
    h.innerHTML = `<div class="kicker">Your home tour${p.agent && p.agent.full_name ? ' with ' + esc(p.agent.full_name) : ''}</div>
      <h1>How did you like them?</h1><p>Tap a face for each home. ${esc(agent.split(' ')[0])} sees it right away.</p>`;
    m.innerHTML = p.stops.map((s) => `<section class="home" data-id="${esc(s.id)}" data-pick="${esc(s.reaction || '')}">
      <div><h2>${esc(s.street)}</h2><div class="s">${[s.town, s.arrive != null ? clock(s.arrive) : ''].filter(Boolean).map(esc).join(' · ')}</div></div>
      <div class="faces" role="group" aria-label="How did you like ${esc(s.street)}?">${REACTIONS.map(([k, label]) => `<button class="face" type="button" data-k="${k}" aria-pressed="${s.reaction === k}">${reactionFace(k, { size: 40, label: '' })}<span>${esc(label)}</span></button>`).join('')}</div>
      <textarea placeholder="Anything to add? (optional)" maxlength="500">${esc(s.note)}</textarea>
      <div class="saved"></div>
    </section>`).join('') + `<div class="end">Questions? ${p.agent && p.agent.phone ? `<a href="tel:${esc(String(p.agent.phone).replace(/[^\d+]/g, ''))}">Call ${esc(agent.split(' ')[0])}</a>` : 'Ask your agent.'}</div>`;
    m.querySelectorAll('.home').forEach((card) => {
      const note = () => card.querySelector('textarea').value;
      card.querySelectorAll('[data-k]').forEach((b) => b.addEventListener('click', () => {
        card.querySelectorAll('[data-k]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
        card.dataset.pick = b.dataset.k;
        save(card, { stop_id: card.dataset.id, reaction: b.dataset.k, note: note() });
      }));
      card.querySelector('textarea').addEventListener('change', () => {
        if (card.dataset.pick) save(card, { stop_id: card.dataset.id, reaction: card.dataset.pick, note: note() });
        else { const o = card.querySelector('.saved'); o.className = 'saved'; o.textContent = 'Tap a face too, then it saves.'; }
      });
    });
  } catch (e) {
    h.innerHTML = '<div class="kicker">Brokers Bestie</div>';
    m.innerHTML = `<div class="gone"><h1>Link ended</h1><p>${esc(e.message)}</p></div>`;
  }
</script>
</body>
</html>
